services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: style_rotation
      POSTGRES_USER: style_rotation
      POSTGRES_PASSWORD: style_rotation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U style_rotation -d style_rotation"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - style_rotation_postgres:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: style_rotation_test
      POSTGRES_USER: style_rotation
      POSTGRES_PASSWORD: style_rotation
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U style_rotation -d style_rotation_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - style_rotation_postgres_test:/var/lib/postgresql/data

volumes:
  style_rotation_postgres:
  style_rotation_postgres_test:
