services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: style_rotation
      POSTGRES_USER: style_rotation
      POSTGRES_PASSWORD: style_rotation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U style_rotation -d style_rotation"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - style_rotation_postgres:/var/lib/postgresql/data

volumes:
  style_rotation_postgres:

