[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "style-rotation-engine"
version = "0.1.0"
description = "Deterministic US style ETF factor research and backtesting platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pandas>=3.0.3,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn>=0.35,<1",
  "yfinance>=1.5.1,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
style-rotation-data-update = "style_rotation.cli.data_update:main"
style-rotation-factor-update = "style_rotation.cli.factor_update:main"
style-rotation-signal-update = "style_rotation.cli.signal_update:main"
style-rotation-backtest-update = "style_rotation.cli.backtest_update:main"
style-rotation-metrics-update = "style_rotation.cli.metrics_update:main"
style-rotation-pipeline-update = "style_rotation.cli.pipeline_update:main"
style-rotation-web = "style_rotation.cli.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"style_rotation.web" = ["static/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires a migrated local PostgreSQL test database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["style_rotation"]

[[tool.mypy.overrides]]
module = ["pandas", "yfinance"]
ignore_missing_imports = true
